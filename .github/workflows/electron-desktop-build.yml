name: Build Electron Desktop App

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/electron/**"
      - "rust/**"
      - ".github/workflows/electron-desktop-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Electron App
    runs-on: windows-latest

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "offline_better_auth_secret_desktop"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://placeholder.example.com"
      UPSTASH_REDIS_REST_TOKEN: "offline_token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://api.marblecms.com"
      MARBLE_WORKSPACE_KEY: "offline_workspace_key"
      FREESOUND_CLIENT_ID: "offline_freesound_id"
      FREESOUND_API_KEY: "offline_freesound_key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build Rust WASM
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web dependencies
        working-directory: apps/web
        run: bun install

      - name: Build Next.js Standalone
        working-directory: apps/web
        run: bun run build

      - name: Prepare Electron standalone bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "apps/electron/standalone" -Force
          Copy-Item -Recurse -Force "apps/web/.next/standalone/*" "apps/electron/standalone/"

          # Copy static files to both possible resolution locations
          New-Item -ItemType Directory -Path "apps/electron/standalone/.next/static" -Force
          Copy-Item -Recurse -Force "apps/web/.next/static/*" "apps/electron/standalone/.next/static/"
          New-Item -ItemType Directory -Path "apps/electron/standalone/apps/web/.next/static" -Force
          Copy-Item -Recurse -Force "apps/web/.next/static/*" "apps/electron/standalone/apps/web/.next/static/"

          # Copy public files to both possible resolution locations
          New-Item -ItemType Directory -Path "apps/electron/standalone/public" -Force
          Copy-Item -Recurse -Force "apps/web/public/*" "apps/electron/standalone/public/"
          New-Item -ItemType Directory -Path "apps/electron/standalone/apps/web/public" -Force
          Copy-Item -Recurse -Force "apps/web/public/*" "apps/electron/standalone/apps/web/public/"

          # Copy package.json
          Copy-Item -Force "apps/web/package.json" "apps/electron/standalone/apps/web/package.json" -ErrorAction SilentlyContinue
          Copy-Item -Force "apps/web/package.json" "apps/electron/standalone/package.json" -ErrorAction SilentlyContinue

          # Check for next module and provide fallback if missing
          $nextInRoot = Test-Path "apps/electron/standalone/node_modules/next"
          $nextInWeb = Test-Path "apps/electron/standalone/apps/web/node_modules/next"
          Write-Host "Checking Next.js in standalone:"
          Write-Host "  standalone/node_modules/next: $nextInRoot"
          Write-Host "  standalone/apps/web/node_modules/next: $nextInWeb"

          if (-not $nextInRoot -and -not $nextInWeb) {
            Write-Host "Next.js was not traced into standalone node_modules! Copying node_modules from apps/web..."
            New-Item -ItemType Directory -Path "apps/electron/standalone/node_modules" -Force
            Copy-Item -Recurse -Force "apps/web/node_modules/*" "apps/electron/standalone/node_modules/"
          }

          Write-Host "Standalone preparation complete. Top-level items:"
          Get-ChildItem -Path "apps/electron/standalone" | Select-Object Name, Mode

      - name: Install Electron dependencies & Build Windows Exe
        working-directory: apps/electron
        run: |
          npm install --no-workspaces
          npx electron-builder --win

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencut-desktop-electron-windows
          path: apps/electron/dist/*.exe
          if-no-files-found: error
